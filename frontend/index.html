<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <header>
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container-md d-flex justify-content-between align-items-center">
      <a class="navbar-brand fw-bold text-white" href="#">Expense Tracker</a>

      
      <button id="theme-toggle-btn" class="btn btn-outline-light btn-sm">
        🌙 Dark Mode
      </button>
    </div>
  </nav>
</header>

    <main>

      <div class="container-md mt-4">

        

          <div class="summary-cards">
  <div class="card text-center h-100">
    <div class="card-body d-flex flex-column justify-content-center">
      <p class="text-muted mb-2">Total</p>
      <h3 class="fw-bold mb-0" id="summary-total">0</h3>
    </div>
  </div>

  <div class="card text-center h-100">
    <div class="card-body d-flex flex-column justify-content-center">
      <p class="text-muted mb-2">Number of expenses</p>
      <h3 class="fw-bold mb-0" id="summary-count">0</h3>
    </div>
  </div>

  <div class="card text-center h-100">
    <div class="card-body d-flex flex-column justify-content-center">
      <p class="text-muted mb-2">Highest expense</p>
      <h3 class="fw-bold mb-0" id="summary-highest-amount">0</h3>
      <small class="text-muted" id="summary-highest-title"></small>
    </div>
  </div>
</div>



        <div class="card mt-4">
          <div class="card-body">
            <h5 class="card-title fw-bold mb-3">Add expense</h5>

            <form id="expense-form">
              <div class="row g-3">

                <div class="col-md-3">
                  <label for="expense-title" class="form-label">Title</label>
                  <input type="text" class="form-control" id="expense-title" placeholder="e.g., Lunch">
                  <div class="invalid-feedback">Title is required.</div>
                </div>

                <div class="col-md-3">
                  <label for="expense-amount" class="form-label">Amount</label>
                  <input  type="number" step="0.01" class="form-control" id="expense-amount" placeholder="0.00">
                  <div class="invalid-feedback">Enter an amount greater than 0.</div>
                </div>

                <div class="col-md-3">
                  <label for="expense-category" class="form-label">Category</label>
                  <select class="form-select" id="expense-category">
                    <option selected disabled value="">Choose...</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                  </select>
                  <div class="invalid-feedback">Choose a category.</div>
                </div>

                <div class="col-md-3">
                  <label for="expense-date" class="form-label">Date</label>
                  <input type="date" class="form-control" id="expense-date">
                  <div class="invalid-feedback">Choose a date.</div>
                </div>

              </div>

              <div class="mt-3">
                <button  type="submit" class="btn btn-primary">Add expense</button>
              </div>

            </form>
          </div>
        </div>

        <div class="card mt-4">
          <div class="card-body">
            
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
  <h5 class="card-title fw-bold mb-0">Expenses</h5>

  <div class="d-flex gap-2 flex-wrap">
    <input 
      type="text" 
      class="form-control" 
      id="search-title" 
      placeholder="Search by title..." 
      style="width: 200px;"
    >

    <select class="form-select w-auto" id="month-filter">
      <option value="All" selected>All Months</option>
      <option value="01">January</option>
      <option value="02">February</option>
      <option value="03">March</option>
      <option value="04">April</option>
      <option value="05">May</option>
      <option value="06">June</option>
      <option value="07">July</option>
      <option value="08">August</option>
      <option value="09">September</option>
      <option value="10">October</option>
      <option value="11">November</option>
      <option value="12">December</option>
    </select>

    <select class="form-select w-auto" id="category-filter">
      <option value="All" selected>All</option>
      <option value="Food">Food</option>
      <option value="Transport">Transport</option>
      <option value="Bills">Bills</option>
      <option value="Entertainment">Entertainment</option>
      <option value="Other">Other</option>
    </select>
  </div>
</div>

            <div id="loading-spinner" class="text-center d-none">
              <div class="spinner-border" role="status"></div>
            </div>

            <div id="table-alert-container"></div>

<div class="table-responsive">
  <table class="table table-hover" id="expenses-table">
    <thead>
      <tr>
        <th>Title</th>
        <th>Amount</th>
        <th>Category</th>
        <th>Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="expenses-table-body">
    </tbody>
  </table>
</div>
      </div>
      </div>
      </div>

      <!-- Edit Expense Modal -->
<div class="modal fade" id="editExpenseModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Expense</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="edit-alert-container"></div>
        <form id="edit-expense-form">
          <div class="mb-3">
            <label for="edit-expense-title" class="form-label">Title</label>
            <input type="text" class="form-control" id="edit-expense-title" required />
          </div>
          <div class="mb-3">
            <label for="edit-expense-amount" class="form-label">Amount</label>
            <input type="number" step="0.01" class="form-control" id="edit-expense-amount" required />
          </div>
          <div class="mb-3">
            <label for="edit-expense-category" class="form-label">Category</label>
            <select class="form-select" id="edit-expense-category" required>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="edit-expense-date" class="form-label">Date</label>
            <input type="date" class="form-control" id="edit-expense-date" required />
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" form="edit-expense-form" class="btn btn-primary" id="save-edit-btn">Save Changes</button>
      </div>
    </div>
  </div>
</div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/app.js"></script>
  </body>
</html>
